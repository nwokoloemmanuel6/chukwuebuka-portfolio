    <main>
        <h1>Academic Planner</h1>
        <p class="intro">Add your study tasks, tick them when they are done and delete the ones you do not need.</p>

        <section class="planner">
            <div class="planner-form">
                <input type="text" id="taskInput" placeholder="Write a task, for example: Revise Week 4">
                <button id="addButton">Add Task</button>
            </div>

            <p id="message"></p>
            <p id="counter"></p>

            <ul id="taskList"></ul>

            <button id="clearButton">Clear Completed</button>
            <button id="clearAllButton">Clear All</button>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Chukwuebuka Nwokolo | COS 106 Term Project | Miva Open University</p>
    </footer>

    <script src="planner.js"></script>
